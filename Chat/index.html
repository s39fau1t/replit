<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Chat</title>
    <link href="style.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <input type="text" id="username-input" class="centered" placeholder="Please enter a username" minlength="3" maxlength="15">
    <div class="centered" style="width: 100px; height: 100px; text-align: center; z-index: -100; user-select: none;">
      <button id="username-submit">Submit</button>
    </div>
    <div id="message-div"></div>
    <input type="text" id="message-input" placeholder="Enter to chat">
    <script src="script.js"></script>
  </body>
</html>
